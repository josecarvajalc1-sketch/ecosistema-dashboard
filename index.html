<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Coordinación — Qué hacer ahora</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* === Notion design system — Operate surface === */
:root{
  --white:#ffffff; --warm:#f6f5f4;
  --ink:rgba(0,0,0,.95); --text:#615d59; --muted:#a39e98;
  --border:rgba(0,0,0,.1); --border-light:rgba(0,0,0,.06);
  --blue:#0075de; --blue-light:#f2f9ff; --blue-dark:#005bab;
  --red:#dc3545; --red-bg:rgba(220,53,69,.08);
  --orange:#dd5b00; --orange-bg:rgba(221,91,0,.08);
  --teal:#2a9d99; --teal-bg:rgba(42,157,153,.08);
  --green:#1aae39; --green-bg:rgba(26,174,57,.08);
  --purple:#391c57; --purple-bg:rgba(57,28,87,.06);
  --shadow:rgba(0,0,0,.04) 0px 4px 18px,rgba(0,0,0,.027) 0px 2px 7.8px,rgba(0,0,0,.02) 0px .8px 2.9px;
  --shadow-deep:rgba(0,0,0,.01) 0px 1px 3px,rgba(0,0,0,.02) 0px 3px 7px,rgba(0,0,0,.02) 0px 7px 15px,rgba(0,0,0,.04) 0px 14px 28px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{color-scheme:light}
body{font-family:'Inter',system-ui,-apple-system,sans-serif;color:var(--ink);background:var(--white);min-height:100vh}

/* interaction */
button,.item-card,.cal-chip{transition:transform .1s ease,background .1s ease}
button:active,.item-card:active{transform:scale(.97)}
a:focus-visible,button:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:4px}

/* === LAYOUT === */
.shell{max-width:720px;margin:0 auto;padding:0 16px 40px}

/* === HEADER === */
.hdr{padding:20px 16px 16px;max-width:720px;margin:0 auto}
.hdr-greet{font-size:22px;font-weight:700;letter-spacing:-.5px;color:var(--ink);line-height:1.2}
.hdr-sub{font-size:13px;color:var(--text);margin-top:4px}
.hdr-sub b{color:var(--red);font-weight:600}
.hdr-actions{display:flex;gap:8px;margin-top:12px}
.hdr-btn{
  background:var(--white);border:1px solid var(--border);color:var(--text);
  padding:7px 14px;border-radius:4px;font-size:13px;font-weight:500;cursor:pointer;
}
.hdr-btn:hover{background:var(--warm)}
.hdr-btn.primary{background:var(--blue);color:var(--white);border-color:var(--blue)}
.hdr-btn.primary:hover{background:var(--blue-dark)}

/* === STRIP CALENDAR (7 días) === */
.cal-strip{
  display:flex;gap:6px;overflow-x:auto;padding:14px 0;
  border-bottom:1px solid var(--border-light);margin-bottom:20px;
  scrollbar-width:none;-webkit-overflow-scrolling:touch;
}
.cal-strip::-webkit-scrollbar{display:none}
.cal-chip{
  flex:0 0 auto;min-width:68px;text-align:center;padding:10px 8px;
  border-radius:8px;cursor:pointer;background:var(--white);border:1px solid var(--border-light);
}
.cal-chip:hover{background:var(--warm)}
.cal-chip.today{border-color:var(--blue);background:var(--blue-light)}
.cal-chip.has{border-left:3px solid var(--blue)}
.cal-chip .cc-day{font-size:11px;color:var(--muted);text-transform:uppercase;font-weight:500;letter-spacing:.3px}
.cal-chip .cc-num{font-size:18px;font-weight:700;color:var(--ink);margin:2px 0}
.cal-chip .cc-count{font-size:10px;color:var(--blue);font-weight:600}
.cal-chip.today .cc-day,.cal-chip.today .cc-num{color:var(--blue)}

/* === SECCIÓN DE ACCIONES === */
.section{margin-bottom:24px}
.section-head{
  display:flex;justify-content:space-between;align-items:baseline;
  margin-bottom:10px;padding:0 2px;
}
.section-head h2{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.5px}
.section-head .count{font-size:12px;color:var(--muted);font-weight:400}
.section-head .dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px;vertical-align:middle}
.dot-red{background:var(--red)}.dot-orange{background:var(--orange)}.dot-teal{background:var(--teal)}.dot-muted{background:var(--muted)}

/* === ITEM CARD === */
.item-card{
  background:var(--white);border:1px solid var(--border);
  border-radius:8px;padding:14px 16px;margin-bottom:8px;
  display:flex;align-items:flex-start;gap:12px;cursor:default;
  box-shadow:var(--shadow);
}
.item-card:hover{box-shadow:var(--shadow-deep)}
.item-card.ahora{border-left:3px solid var(--red)}
.item-card.hoy{border-left:3px solid var(--orange)}
.item-card.semana{border-left:3px solid var(--teal)}
.item-card.done{opacity:.35}
.item-body{flex:1;min-width:0}
.item-title{font-size:14px;font-weight:600;color:var(--ink);line-height:1.35}
.item-detail{font-size:12px;color:var(--text);margin-top:3px;line-height:1.45}
.item-meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;align-items:center}
.pill{
  display:inline-flex;align-items:center;font-size:11px;font-weight:600;
  padding:2px 8px;border-radius:9999px;letter-spacing:.1px;
}
.pill-blue{background:var(--blue-light);color:var(--blue)}
.pill-red{background:var(--red-bg);color:var(--red)}
.pill-orange{background:var(--orange-bg);color:var(--orange)}
.pill-teal{background:var(--teal-bg);color:var(--teal)}
.pill-green{background:var(--green-bg);color:var(--green)}
.pill-purple{background:var(--purple-bg);color:var(--purple)}
.pill-gray{background:var(--warm);color:var(--text)}
.item-date{font-size:11px;color:var(--muted);font-weight:500}

/* === ITEM ACTIONS === */
.item-actions{display:flex;gap:4px;flex:0 0 auto;align-items:center}
.act-sm{
  background:var(--warm);border:1px solid var(--border-light);color:var(--text);
  padding:5px 10px;border-radius:4px;font-size:11px;font-weight:500;cursor:pointer;
  white-space:nowrap;
}
.act-sm:hover{background:var(--border-light)}
.act-sm.primary{background:var(--blue-light);color:var(--blue);border-color:rgba(0,117,222,.15)}
.act-sm.primary:hover{background:rgba(0,117,222,.12)}
.act-sm.green{background:var(--green-bg);color:var(--green);border-color:rgba(26,174,57,.15)}
.act-sm select{
  background:transparent;border:none;color:inherit;font-size:11px;font-weight:500;
  cursor:pointer;font-family:inherit;padding:0;
}
.act-sm select option{background:var(--white);color:var(--ink)}

/* === EMPTY === */
.empty-state{
  text-align:center;padding:28px 16px;color:var(--muted);font-size:13px;
  border:1px dashed var(--border);border-radius:8px;
}
.empty-state .emoji{font-size:28px;margin-bottom:8px}

/* === DELEGATE HINT === */
.delegate{
  background:var(--purple-bg);border:1px solid rgba(57,28,87,.1);
  border-radius:8px;padding:12px 16px;margin-top:16px;
}
.delegate h3{font-size:12px;font-weight:600;color:var(--purple);text-transform:uppercase;letter-spacing:.4px;margin-bottom:6px}
.delegate p{font-size:12px;color:var(--text);line-height:1.5}
.delegate .deleg-items{margin-top:8px;display:flex;flex-direction:column;gap:4px}
.delegate .deleg-item{
  display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text);
  background:var(--white);border:1px solid var(--border-light);border-radius:6px;padding:8px 10px;
}
.delegate .deleg-item span{flex:1}
.delegate .deleg-item .deleg-ico{font-size:14px}

/* === TOAST === */
.toast{
  position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
  background:var(--ink);color:var(--white);
  padding:10px 18px;border-radius:8px;font-size:13px;font-weight:500;
  opacity:0;transition:opacity .3s;z-index:50;pointer-events:none;
  box-shadow:var(--shadow-deep);
}
.toast.show{opacity:1}

/* === FOOTER === */
footer{text-align:center;padding:16px;color:var(--muted);font-size:11px;border-top:1px solid var(--border-light)}

/* === MOBILE === */
@media(max-width:600px){
  .hdr{padding:16px 14px 12px}
  .hdr-greet{font-size:19px}
  .shell{padding:0 14px 32px}
  .item-card{padding:12px 14px}
  .item-title{font-size:13.5px}
  .cal-chip{min-width:60px;padding:8px 6px}
  .cal-chip .cc-num{font-size:16px}
  .item-actions{width:100%;justify-content:flex-end;margin-top:6px}
  .act-sm{min-height:36px;display:flex;align-items:center}
}
@media(min-width:721px){
  .hdr{padding:28px 0 20px}
  .shell{padding:0 0 40px}
}
</style>
</head>
<body>

<div class="hdr" id="hdr">
  <div class="hdr-greet" id="greet">Cargando…</div>
  <div class="hdr-sub" id="hdrSub"></div>
  <div class="hdr-actions">
    <button class="hdr-btn" onclick="load()">⟳ Actualizar</button>
  </div>
</div>

<!-- Calendar strip -->
<div class="shell">
  <div class="cal-strip" id="calStrip"></div>
</div>

<!-- Action queue -->
<div class="shell" id="actionQueue">
  <div class="empty-state"><div class="emoji">📋</div>Cargando tu día…</div>
</div>

<!-- Delegation hints -->
<div class="shell" id="delegateSection" style="display:none"></div>

<footer>Coordinación Pedagógica · base tipo Notion · Google Sheets</footer>
<div class="toast" id="toast"></div>

<script>
var API='https://script.google.com/macros/s/AKfycbzjdrQlGLdTH8mQ2wnj8H3jtgoZWRBnDY0yOMUlHHl8ZUlxThI-rJacQWpPhdtQ1VMI/exec';
var ITEMS=[];

function esc(s){return(s||'').replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]});}
function toast(m){var t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(function(){t.classList.remove('show');},2200);}
function diasDesde(f){if(!f)return null;try{var d=new Date(f);if(isNaN(d))return null;return Math.max(0,Math.floor((Date.now()-d)/86400000));}catch(e){return null;}}
function diasHasta(f){if(!f)return null;try{var d=new Date(f);if(isNaN(d))return null;return Math.ceil((d-Date.now())/86400000);}catch(e){return null;}}
function esHoy(f){if(!f)return false;var t=new Date();var d=new Date(f);return t.toDateString()===d.toDateString();}
function fechaStr(f){if(!f)return'';try{return new Date(f).toLocaleDateString('es-CL',{weekday:'short',day:'numeric',month:'short'});}catch(e){return f.slice(0,10);}}
function tipoIcon(t){t=(t||'').toLowerCase();return t==='correo'?'✉':t==='caso'?'🗂':t==='evento'?'📅':t==='tarea'?'✅':'📄';}
function tipoColor(t){t=(t||'').toLowerCase();return t==='correo'?'blue':t==='caso'?'teal':t==='evento'?'purple':'gray';}
function prioColor(n){n=(n||'').toLowerCase();return n==='alta'?'red':n==='media'?'orange':'teal';}
function estColor(s){s=(s||'').toLowerCase();return s==='en seguimiento'||s==='en curso'?'green':s==='nuevo'?'blue':s==='atendido'?'gray':'blue';}
function prioOrd(n){n=(n||'').toLowerCase();return n==='alta'?0:n==='media'?1:n==='baja'?2:3;}

async function api(p){try{var r=await fetch(API+'?'+new URLSearchParams(p).toString());return await r.json();}catch(e){return{ok:false,error:String(e)};}}

async function load(){
  var d=await api({action:'read',sheet:'Base'});
  if(!d.ok){document.getElementById('actionQueue').innerHTML='<div class="empty-state"><div class="emoji">⚠️</div>Error: '+(d.error||'?')+'</div>';return;}
  ITEMS=(d.rows||[]).slice(1);
  render();
}

function getGreeting(){
  var h=new Date().getHours();
  if(h<12)return'Buenos días';
  if(h<19)return'Buenas tardes';
  return'Buenas noches';
}

function urgency(r){
  // Returns: 'ahora' | 'hoy' | 'semana' | 'despues' | 'done'
  var est=(r[2]||'').toLowerCase();
  if(est==='atendido'||est==='completado')return'done';
  var pri=(r[3]||'').toLowerCase();
  var vence=r[5]||r[4];
  var dh=vence?diasHasta(vence):null;
  var di=r[4]?diasDesde(r[4]):null;
  if(pri==='alta')return'ahora';
  if(dh!==null&&dh<=0)return'ahora'; // vencido
  if(dh!==null&&dh<=1)return'ahora'; // vence hoy/mañana
  if(pri==='media')return'hoy';
  if(dh!==null&&dh<=3)return'hoy';
  if(di!==null&&di>30&&(r[1]||'').toLowerCase()==='caso')return'hoy'; // inactivo
  return'semana';
}

function render(){
  // Greeting
  var active=ITEMS.filter(function(r){var e=(r[2]||'').toLowerCase();return e!=='atendido'&&e!=='completado';});
  var urgentes=active.filter(function(r){return urgency(r)==='ahora';});
  var hoy=active.filter(function(r){return urgency(r)==='hoy';});

  document.getElementById('greet').textContent=getGreeting();
  var sub='';
  if(urgentes.length)sub+='<b>'+urgentes.length+' urgente'+(urgentes.length>1?'s':'')+'</b>';
  if(hoy.length){if(sub)sub+=' · ';sub+=hoy.length+' para hoy';}
  if(!sub)sub=active.length+' pendiente'+(active.length>1?'s':'')+' — todo tranquilo';
  document.getElementById('hdrSub').innerHTML=sub;

  renderCalStrip();
  renderQueue();
  renderDelegate();
}

function renderCalStrip(){
  var el=document.getElementById('calStrip');
  var today=new Date();today.setHours(0,0,0,0);
  var byDate={};
  ITEMS.forEach(function(r){
    var ds=r[4]||r[5];if(!ds)return;ds=ds.length>10?ds.slice(0,10):ds;
    if(!byDate[ds])byDate[ds]=0;byDate[ds]++;
  });
  var h='';
  for(var i=0;i<7;i++){
    var d=new Date(today);d.setDate(d.getDate()+i);
    var ds=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
    var dayNames=['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
    var cls='cal-chip';
    if(i===0)cls+=' today';
    if(byDate[ds])cls+=' has';
    h+='<div class="'+cls+'">';
    h+='<div class="cc-day">'+(i===0?'Hoy':dayNames[d.getDay()])+'</div>';
    h+='<div class="cc-num">'+d.getDate()+'</div>';
    if(byDate[ds])h+='<div class="cc-count">'+byDate[ds]+' ítem'+(byDate[ds]>1?'s':'')+'</div>';
    h+='</div>';
  }
  el.innerHTML=h;
}

function renderQueue(){
  var el=document.getElementById('actionQueue');
  // Group by urgency
  var groups={ahora:[],hoy:[],semana:[]};
  ITEMS.forEach(function(r){
    var u=urgency(r);
    if(u==='done'||u==='despues')return;
    groups[u].push(r);
  });
  // Sort within groups by priority
  Object.keys(groups).forEach(function(k){
    groups[k].sort(function(a,b){return prioOrd(a[3])-prioOrd(b[3]);});
  });

  var h='';
  var sections=[
    {key:'ahora',label:'Hacer ahora',dot:'dot-red'},
    {key:'hoy',label:'Para hoy',dot:'dot-orange'},
    {key:'semana',label:'Esta semana',dot:'dot-teal'}
  ];

  var anyItems=false;
  sections.forEach(function(s){
    var items=groups[s.key];
    if(!items.length)return;
    anyItems=true;
    h+='<div class="section">';
    h+='<div class="section-head"><h2><span class="dot '+s.dot+'"></span>'+s.label+'</h2><span class="count">'+items.length+'</span></div>';
    items.forEach(function(r){
      h+=itemCard(r,s.key);
    });
    h+='</div>';
  });

  if(!anyItems){
    h='<div class="empty-state"><div class="emoji">🎉</div>Todo al día. Sin pendientes urgentes.</div>';
  }
  el.innerHTML=h;
}

function itemCard(r,urg){
  var idx=ITEMS.indexOf(r);
  var done=(r[2]||'').toLowerCase()==='atendido'||(r[2]||'').toLowerCase()==='completado';
  var fecha=r[4];if(fecha&&fecha.length>10)fecha=fecha.slice(0,10);
  var vence=r[5];if(vence&&vence.length>10)vence=vence.slice(0,10);
  var di=r[4]?diasDesde(r[4]):null;
  var dh=vence?diasHasta(vence):null;

  var cls='item-card '+urg+(done?' done':'');

  var h='<div class="'+cls+'">';
  h+='<div class="item-body">';
  h+='<div class="item-title">'+esc(r[0])+'</div>';

  // Context line
  var ctx='';
  if(r[8])ctx=esc(r[8]);
  else if(r[6])ctx=esc(r[6]);
  if(ctx)h+='<div class="item-detail">'+ctx+'</div>';

  // Meta pills
  h+='<div class="item-meta">';
  h+='<span class="pill pill-'+tipoColor(r[1])+'">'+tipoIcon(r[1])+' '+esc(r[1])+'</span>';
  h+='<span class="pill pill-'+prioColor(r[3])+'">'+esc(r[3])+'</span>';
  h+='<span class="pill pill-'+estColor(r[2])+'">'+esc(r[2])+'</span>';
  if(fecha)h+='<span class="item-date">📅 '+fechaStr(fecha)+'</span>';
  if(vence){
    var vLabel='⏰ '+fechaStr(vence);
    if(dh!==null&&dh<=0)vLabel+=' ⚠ vencido';
    else if(dh!==null&&dh<=1)vLabel+=' ⚠ vence pronto';
    h+='<span class="item-date">'+vLabel+'</span>';
  }
  if(di!==null&&di>30&&(r[1]||'').toLowerCase()==='caso')
    h+='<span class="pill pill-purple">⚠ sin actividad '+di+'d</span>';
  h+='</div></div>';

  // Actions
  h+='<div class="item-actions">';
  if(done){
    h+='<span class="pill pill-gray">✓</span>';
  }else{
    h+='<div class="act-sm"><select onchange="setPrio('+idx+',this.value)">';
    h+='<option value="Alta"'+((r[3]||'').toLowerCase()==='alta'?' selected':'')+'>Alta</option>';
    h+='<option value="Media"'+((r[3]||'').toLowerCase()==='media'?' selected':'')+'>Media</option>';
    h+='<option value="Baja"'+((r[3]||'').toLowerCase()==='baja'?' selected':'')+'>Baja</option>';
    h+='</select></div>';
    h+='<button class="act-sm green" onclick="markDone('+idx+')">✓ Listo</button>';
  }
  h+='</div></div>';
  return h;
}

function renderDelegate(){
  var el=document.getElementById('delegateSection');
  // Find items that could be delegated (correos clasificados, informativos, etc.)
  var delegable=ITEMS.filter(function(r){
    var t=(r[1]||'').toLowerCase();
    var p=(r[3]||'').toLowerCase();
    var e=(r[2]||'').toLowerCase();
    if(e==='atendido'||e==='completado')return false;
    if(t==='correo'&&p==='baja')return true;
    if(t==='evento')return true;
    return false;
  });

  if(!delegable.length){el.style.display='none';return;}
  el.style.display='block';

  var h='<div class="delegate">';
  h+='<h3>🤖 Posibles para delegar con IA</h3>';
  h+='<p>Estos ítems son informativos o de baja prioridad — la IA puede procesarlos o preparar respuestas.</p>';
  h+='<div class="deleg-items">';
  delegable.forEach(function(r){
    h+='<div class="deleg-item">';
    h+='<span class="deleg-ico">'+tipoIcon(r[1])+'</span>';
    h+='<span>'+esc(r[0])+'</span>';
    h+='<span class="pill pill-'+prioColor(r[3])+'" style="font-size:10px">'+esc(r[3])+'</span>';
    h+='</div>';
  });
  h+='</div></div>';
  el.innerHTML=h;
}

async function setPrio(idx,val){
  var row=idx+2;
  await api({action:'update',sheet:'Base',row:row,col:'D',value:val});
  toast('Prioridad → '+val);load();
}
async function markDone(idx){
  var row=idx+2;
  await api({action:'update',sheet:'Base',row:row,col:'C',value:'Atendido'});
  toast('✓ Completado');load();
}

load();
setInterval(load,120000);
</script>
</body>
</html>
