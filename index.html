<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ecosistema Coordinación Pedagógica</title>
<style>
:root{
  --bg:#0f172a; --card:#1e293b; --card2:#273549; --border:#334155;
  --text:var(--foreground,#e2e8f0); --muted:var(--muted-foreground,#94a3b8);
  --alta:#ef4444; --media:#f59e0b; --baja:#22c55e; --neutral:#64748b;
  --accent:var(--accent,#38bdf8); --inac:#8b5cf6;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,sans-serif;padding:0;background:transparent;color:var(--text)}
header{padding:20px 20px 12px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px}
header h1{font-size:18px;font-weight:800}
header .sub{color:var(--muted);font-size:12px;margin-top:2px}
.refresh{background:var(--card2);border:1px solid var(--border);color:var(--text);padding:6px 14px;border-radius:8px;font-size:12px;cursor:pointer}
.refresh:hover{border-color:var(--accent)}
/* tabs tipo Notion */
.tabs{display:flex;gap:6px;padding:10px 20px;border-bottom:1px solid var(--border);overflow-x:auto;flex-wrap:wrap}
.tab{background:var(--card);border:1px solid var(--border);color:var(--muted);padding:7px 14px;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap}
.tab.active{background:var(--accent);color:#06283d;border-color:var(--accent)}
.tab .n{opacity:.7;font-weight:400;margin-left:4px}
/* cards superiores */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;padding:16px 20px;border-bottom:1px solid var(--border)}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:10px 12px}
.card .num{font-size:24px;font-weight:800}
.card .lbl{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
.b-alta{color:var(--alta)}.b-media{color:var(--media)}.b-baja{color:var(--baja)}.b-total{color:var(--accent)}.b-inac{color:var(--inac)}
/* lista ítems */
.panel{padding:12px 20px 30px}
.list{display:flex;flex-direction:column;gap:8px}
.item{background:var(--card);border:1px solid var(--border);border-left:4px solid var(--neutral);border-radius:10px;padding:12px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.item.alta{border-left-color:var(--alta)}.item.media{border-left-color:var(--media)}.item.baja{border-left-color:var(--baja)}.item.inac{border-left-color:var(--inac);background:rgba(139,92,246,.06)}
.item.done{opacity:.5}
.item .main{flex:1;min-width:180px}
.item .nom{font-weight:600;font-size:13px}
.item .nom .extra{color:var(--muted);font-weight:400;font-size:11px;display:block;margin-top:2px}
.item .meta{font-size:11px;color:var(--muted);margin-top:5px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pill{display:inline-block;font-size:10px;padding:1px 8px;border-radius:12px;font-weight:700;white-space:nowrap}
.t-correo{background:var(--accent);color:#06283d}.t-caso{background:var(--media);color:#111}.t-evento{background:#0ea5e9;color:#082f49}.t-tarea{background:#22c55e;color:#041}
.p-alta{background:var(--alta);color:#fff}.p-media{background:var(--media);color:#111}.p-baja{background:var(--baja);color:#041}.p-otro{background:var(--neutral);color:#fff}.p-done{background:var(--neutral);color:#fff}.p-inac{background:var(--inac);color:#fff}.p-nuevo{background:var(--accent);color:#06283d}
.s-en{background:#22c55e;color:#041}.s-nuev{background:var(--card2);color:var(--text);border:1px solid var(--border)}.s-prog{background:#0ea5e9;color:#082f49}.s-aten{background:#64748b;color:#fff}
.cat{background:var(--card2);color:var(--muted);border:1px solid var(--border)}
.actions{display:flex;gap:5px;align-items:center}
.btn{background:var(--card2);border:1px solid var(--border);color:var(--text);padding:4px 9px;border-radius:8px;font-size:11px;cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn.done-btn{background:rgba(34,197,94,.18);border-color:var(--baja);color:var(--baja)}
.sel{background:var(--card2);border:1px solid var(--border);color:var(--text);padding:3px;border-radius:8px;font-size:11px}
.empty{color:var(--muted);font-size:12px;padding:20px;text-align:center;border:1px dashed var(--border);border-radius:10px}
footer{color:var(--muted);font-size:10px;text-align:center;padding:12px;border-top:1px solid var(--border)}
.toast{position:fixed;bottom:18px;right:18px;background:var(--card2);border:1px solid var(--border);padding:10px 14px;border-radius:10px;font-size:12px;opacity:0;transition:opacity .3s;z-index:10}
.toast.show{opacity:1}
</style>
</head>
<body>
<header>
  <div>
    <h1>Ecosistema Coordinación Pedagógica</h1>
    <div class="sub" id="updatedAt">Cargando…</div>
  </div>
  <div style="display:flex;gap:8px;align-items:center">
    <button class="refresh" onclick="load()">⟳ Actualizar</button>
  </div>
</header>

<div class="tabs" id="tabs">
  <div class="tab active" data-v="inbox" onclick="setView('inbox')">📥 Inbox</div>
  <div class="tab" data-v="urgente" onclick="setView('urgente')">🔥 Urgente</div>
  <div class="tab" data-v="calendario" onclick="setView('calendario')">📅 Próximos</div>
  <div class="tab" data-v="casos" onclick="setView('casos')">🗂 Casos</div>
  <div class="tab" data-v="todos" onclick="setView('todos')">☰ Todos</div>
</div>

<div class="cards">
  <div class="card"><div class="num b-total" id="cTotal">–</div><div class="lbl">Ítems</div></div>
  <div class="card"><div class="num b-alta" id="cAlta">–</div><div class="lbl">Alta</div></div>
  <div class="card"><div class="num b-media" id="cMedia">–</div><div class="lbl">Media</div></div>
  <div class="card"><div class="num b-baja" id="cBaja">–</div><div class="lbl">Baja</div></div>
  <div class="card"><div class="num b-inac" id="cInac">–</div><div class="lbl">Inactivos</div></div>
</div>

<div class="panel"><div class="list" id="lista"><div class="empty">Cargando…</div></div></div>

<footer>Ecosistema Coordinación · base tipo Notion · lee y escribe Google Sheets</footer>
<div class="toast" id="toast"></div>

<script>
var API='https://script.google.com/macros/s/AKfycbzjdrQlGLdTH8mQ2wnj8H3jtgoZWRBnDY0yOMUlHHl8ZUlxThI-rJacQWpPhdtQ1VMI/exec';
var ITEMS=[]; var VIEW='inbox'; var T_INACT=30;

function esc(s){return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function toast(m){var t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(function(){t.classList.remove('show');},2200);}
function diasDesde(f){if(!f)return null;try{var d=new Date(f);if(isNaN(d))return null;return Math.max(0,Math.floor((Date.now()-d)/86400000));}catch(e){return null;}}
function tipoPill(t){t=(t||'').toLowerCase();return t==='correo'?'t-correo':t==='caso'?'t-caso':t==='evento'?'t-evento':t==='tarea'?'t-tarea':'cat';}
function prioPill(n){n=(n||'').toLowerCase();return n==='alta'?'p-alta':n==='media'?'p-media':n==='baja'?'p-baja':'p-otro';}
function estPill(s){s=(s||'').toLowerCase();return s==='en seguimiento'||s==='en curso'?'s-en':s==='nuevo'?'s-nuev':s==='programado'||s==='pendiente'?'s-prog':s==='atendido'?'s-aten':'s-nuev';}
function prioOrd(n){n=(n||'').toLowerCase();return n==='alta'?0:n==='media'?1:n==='baja'?2:3;}
function rcl(n){n=(n||'').toLowerCase();return n==='alta'?'alta':n==='media'?'media':n==='baja'?'baja':'';}
function inac(r){var f=r[5]||r[4];var d=diasDesde(f);return d!==null&&d>T_INACT && (r[1]||'').toLowerCase()==='caso';}

async function api(params){
  try{var r=await fetch(API+'?'+new URLSearchParams(params).toString());return await r.json();}
  catch(e){return {ok:false,error:String(e)};}
}

async function load(){
  var d=await api({action:'read',sheet:'Base'});
  if(!d.ok){document.getElementById('lista').innerHTML='<div class="empty">Error: '+(d.error||'?')+'</div>';return;}
  ITEMS=(d.rows||[]).slice(1);
  render();
  document.getElementById('updatedAt').textContent='Actualizado: '+new Date().toLocaleTimeString();
}

function setView(v){
  VIEW=v;
  document.querySelectorAll('.tab').forEach(function(t){t.classList.toggle('active',t.getAttribute('data-v')===v);});
  render();
}

function filtered(){
  var s=ITEMS.slice();
  if(VIEW==='casos') s=s.filter(function(r){return (r[1]||'').toLowerCase()==='caso';});
  else if(VIEW==='calendario') s=s.filter(function(r){return r[4]||r[5];}).sort(function(a,b){return (a[4]||'').localeCompare(b[4]||'');});
  else if(VIEW==='urgente') s=s.filter(function(r){return (r[3]||'').toLowerCase()==='alta';});
  else if(VIEW==='inbox') s=s.filter(function(r){var e=(r[2]||'').toLowerCase();return e!=='atendido'&&e!=='completado';});
  s.sort(function(a,b){return prioOrd(a[3])-prioOrd(b[3]);});
  return s;
}

function render(){
  var a=0,m=0,b=0,inx=0;
  ITEMS.forEach(function(r){var p=(r[3]||'').toLowerCase();if(p==='alta')a++;else if(p==='media')m++;else if(p==='baja')b++;if(inac(r))inx++;});
  document.getElementById('cTotal').textContent=ITEMS.length;
  document.getElementById('cAlta').textContent=a;
  document.getElementById('cMedia').textContent=m;
  document.getElementById('cBaja').textContent=b;
  document.getElementById('cInac').textContent=inx;
  var list=filtered();
  var el=document.getElementById('lista');
  if(!list.length){el.innerHTML='<div class="empty">Sin ítems en esta vista.</div>';return;}
  el.innerHTML=list.map(function(r,i){
    var idx=ITEMS.indexOf(r);
    var done=(r[2]||'').toLowerCase()==='atendido'||(r[2]||'').toLowerCase()==='completado';
    var fecha=r[4]; if(fecha&&fecha.length>10)fecha=fecha.slice(0,10);
    var vence=r[5]; if(vence&&vence.length>10)vence=vence.slice(0,10);
    var ia=inac(r);
    return '<div class="item '+rcl(r[3])+(ia?' inac':'')+(done?' done':'')+'">'+
      '<div class="main"><div class="nom">'+esc(r[0])+
      (r[8]?'<span class="extra">'+esc(r[8])+'</span>':'')+'</div>'+
      '<div class="meta"><span class="pill '+tipoPill(r[1])+'">'+esc(r[1])+'</span>'+
      '<span class="pill '+prioPill(r[3])+'">'+esc(r[3])+'</span>'+
      '<span class="pill '+estPill(r[2])+'">'+esc(r[2])+'</span>'+
      (fecha?'<span>📅 '+esc(fecha)+'</span>':'')+
      (vence?'<span>⏰ '+esc(vence)+'</span>':'')+
      (r[6]?'<span class="pill cat">'+esc(r[6])+'</span>':'')+
      (ia?'<span class="pill p-inac">⚠ inactivo '+diasDesde(r[5]||r[4])+'d</span>':'')+
      '</div></div>'+
      '<div class="actions">'+
        (done?'<span class="pill s-aten">✓</span>':
          '<select class="sel" onchange="setPrio('+idx+',this.value)">'+
          '<option value="Alta" '+((r[3]||'').toLowerCase()==='alta'?'selected':'')+'>Alta</option>'+
          '<option value="Media" '+((r[3]||'').toLowerCase()==='media'?'selected':'')+'>Media</option>'+
          '<option value="Baja" '+((r[3]||'').toLowerCase()==='baja'?'selected':'')+'>Baja</option></select>'+
          '<button class="btn done-btn" onclick="markDone('+idx+')">✓ estado</button>')+
      '</div></div>';
  }).join('');
}

async function setPrio(idx,val){
  var row=idx+2;
  await api({action:'update',sheet:'Base',row:row,col:'D',value:val});
  toast('Prioridad → '+val+' ✓'); load();
}
async function markDone(idx){
  var row=idx+2, cur=(ITEMS[idx][2]||'').toLowerCase();
  var nuevo=cur==='atendido'||cur==='completado'?'Nuevo':'Atendido';
  await api({action:'update',sheet:'Base',row:row,col:'C',value:nuevo});
  toast((nuevo==='Atendido'?'✓ Completado':'Reabierto')); load();
}

load();
setInterval(load,120000);
</script>
</body>
</html>
