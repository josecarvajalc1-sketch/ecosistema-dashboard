<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Ecosistema Coordinación Pedagógica</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,500;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  /* === design system Guitarra 2 — tema claro pastel === */
  --bg:#f6f7fb; --surface:#ffffff; --surface-soft:#eef0f6;
  --ink:#23212f; --muted:#8a88a0; --line:#e7e8f0;
  --mint:#9ee8cf; --mint-ink:#147d5f;
  --lavender:#c9bdf7; --lavender-ink:#5b4aa8;
  --peach:#ffd9a8; --peach-ink:#a86a1a;
  --sky:#b8d4f7; --sky-ink:#2e5f9e;
  --rose:#f4bcd4; --rose-ink:#a03a61;
  /* prioridades */
  --p-alta:#e05252; --p-media:#d49a2a; --p-baja:#27ae60; --p-inac:#8b5cf6;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{color:var(--ink);font-family:'DM Sans','Segoe UI',system-ui,sans-serif;min-height:100%;
  background:var(--bg);color-scheme:light}
h1,h2,h3{font-family:'Georgia','Cambria',serif;margin:0}
button,input,select{font-family:inherit}

/* — tap feedback — */
.tab,.refresh,.act-btn,.sel{
  transition:transform .12s ease,box-shadow .12s ease;will-change:transform}
.tab:active,.refresh:active,.act-btn:active,.sel:active{
  transform:scale(1.05);box-shadow:0 6px 16px rgba(0,0,0,.12)}
@media(hover:hover)and(pointer:fine){
  .tab:hover{transform:scale(1.03)}
}
a:focus-visible,button:focus-visible,select:focus-visible{outline:2px solid var(--lavender);outline-offset:2px;border-radius:4px}

/* — HEADER (sticky blur blanco) — */
header{
  position:sticky;top:0;z-index:20;
  background:rgba(255,255,255,.86);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  border-bottom:1px solid var(--line);
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:12px 16px 10px;
}
header h1{
  font-size:16px;font-weight:700;color:var(--lavender-ink);letter-spacing:.2px;line-height:1.2;
}
header .sub{color:var(--muted);font-size:11px;margin-top:2px}
.refresh{
  background:var(--surface-soft);border:1px solid var(--line);color:var(--ink);
  padding:7px 14px;border-radius:10px;font-size:12px;font-weight:600;cursor:pointer;
  display:flex;align-items:center;gap:4px;white-space:nowrap;
}

/* — TABS (scroll horizontal) — */
.tabs{
  display:flex;gap:6px;padding:10px 16px;overflow-x:auto;
  border-bottom:1px solid var(--line);background:var(--surface);
  -webkit-overflow-scrolling:touch;scrollbar-width:none;
}
.tabs::-webkit-scrollbar{display:none}
.tab{
  background:var(--surface-soft);border:1px solid var(--line);
  color:var(--muted);padding:7px 13px;border-radius:10px;
  font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap;flex:0 0 auto;
}
.tab.active{background:var(--lavender);color:var(--lavender-ink);border-color:var(--lavender);font-weight:700}

/* — CALENDARIO PROMINENTE — */
.cal-prom{
  margin:16px 16px 0;background:var(--surface);border:1px solid var(--line);
  border-radius:18px;padding:18px 16px;box-shadow:0 6px 20px rgba(35,33,47,.05);
}
.cal-prom .cal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.cal-prom .cal-head h2{font-size:15px;color:var(--ink);font-family:'Georgia',serif}
.cal-prom .cal-head .cal-legend{display:flex;gap:10px;flex-wrap:wrap}
.cal-prom .cal-legend span{font-size:10px;display:flex;align-items:center;gap:4px}
.cal-prom .cal-legend .dot{width:8px;height:8px;border-radius:50%;flex:0 0 auto}
.cal-prom .cal-month{font-size:12px;font-weight:700;color:var(--lavender-ink);text-transform:capitalize;margin-bottom:10px}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal-grid .dow{font-size:9px;color:var(--muted);text-transform:uppercase;padding-bottom:4px;font-weight:600}
.cal-grid .day{font-size:11.5px;color:var(--muted);padding:6px 0;border-radius:8px;cursor:default;position:relative}
.cal-grid .day.today{outline:2px solid var(--lavender);font-weight:700}
.cal-grid .day.has-event{background:var(--sky);color:var(--sky-ink);font-weight:700;cursor:pointer}
.cal-grid .day.has-eval{background:var(--rose);color:var(--rose-ink);font-weight:700;cursor:pointer}
.cal-grid .day.has-case{background:var(--mint);color:var(--mint-ink);font-weight:700;cursor:pointer}
.cal-grid .day.out{color:var(--line)}

/* Eventos del día seleccionado */
.cal-events{margin-top:14px;border-top:1px solid var(--line);padding-top:12px}
.cal-events h3{font-size:12px;color:var(--lavender-ink);text-transform:uppercase;letter-spacing:.4px;margin-bottom:8px;font-family:'DM Sans',sans-serif}
.cal-ev-item{
  display:flex;align-items:center;gap:10px;padding:9px 12px;margin-bottom:6px;
  background:var(--surface-soft);border:1px solid var(--line);border-radius:10px;
}
.cal-ev-item .ev-icon{flex:0 0 28px;width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:13px}
.cal-ev-item .ev-icon.ev-ev{background:var(--sky);color:var(--sky-ink)}
.cal-ev-item .ev-icon.ev-case{background:var(--mint);color:var(--mint-ink)}
.cal-ev-item .ev-icon.ev-corr{background:var(--rose);color:var(--rose-ink)}
.cal-ev-item .ev-text{flex:1;min-width:0}
.cal-ev-item .ev-text b{display:block;font-size:12px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal-ev-item .ev-text span{font-size:10px;color:var(--muted)}
.cal-empty{font-size:11.5px;color:var(--muted);text-align:center;padding:10px 0}

/* — STAT CARDS — */
.stats{
  display:grid;grid-template-columns:repeat(5,1fr);gap:8px;
  padding:14px 16px;border-bottom:1px solid var(--line);background:var(--surface);
}
.stat{
  border:1px solid var(--line);border-radius:14px;padding:10px 6px;text-align:center;
}
.stat .num{font-family:'Georgia',serif;font-size:22px;font-weight:700}
.stat .lbl{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;margin-top:2px}
.s-total{background:var(--sky);border-color:#a8c4e8}.s-total .num{color:var(--sky-ink)}
.s-alta{background:var(--rose);border-color:#e8a8be}.s-alta .num{color:var(--rose-ink)}
.s-media{background:var(--peach);border-color:#e8d0a0}.s-media .num{color:var(--peach-ink)}
.s-baja{background:var(--mint);border-color:#b8e0d0}.s-baja .num{color:var(--mint-ink)}
.s-inac{background:var(--lavender);border-color:#b8b0e0}.s-inac .num{color:var(--lavender-ink)}

/* — PANEL + LISTA — */
.panel{padding:14px 16px 40px}
.list{display:flex;flex-direction:column;gap:8px}

/* — ITEM (card blanca) — */
.item{
  background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--muted);
  border-radius:14px;padding:14px;display:flex;justify-content:space-between;align-items:flex-start;
  gap:10px;flex-wrap:wrap;box-shadow:0 4px 12px rgba(35,33,47,.04);
}
.item.alta{border-left-color:var(--p-alta)}.item.media{border-left-color:var(--p-media)}
.item.baja{border-left-color:var(--p-baja)}.item.inac{border-left-color:var(--p-inac);background:rgba(139,92,246,.04)}
.item.done{opacity:.4}
.item .main{flex:1;min-width:160px}
.item .nom{font-weight:700;font-size:13.5px;line-height:1.3;color:var(--ink)}
.item .nom .extra{color:var(--muted);font-weight:400;font-size:11px;display:block;margin-top:3px;line-height:1.4}
.item .meta{font-size:10.5px;color:var(--muted);margin-top:5px;display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.pill{
  display:inline-block;font-size:9.5px;padding:2px 8px;border-radius:10px;
  font-weight:700;white-space:nowrap;letter-spacing:.2px;
}
.t-correo{background:var(--sky);color:var(--sky-ink)}.t-caso{background:var(--mint);color:var(--mint-ink)}
.t-evento{background:var(--lavender);color:var(--lavender-ink)}.t-tarea{background:var(--peach);color:var(--peach-ink)}
.p-alta{background:var(--p-alta);color:#fff}.p-media{background:var(--p-media);color:#fff}
.p-baja{background:var(--p-baja);color:#fff}.p-otro{background:var(--surface-soft);color:var(--ink);border:1px solid var(--line)}
.p-inac{background:var(--p-inac);color:#fff}.p-nuevo{background:var(--lavender);color:var(--lavender-ink)}
.s-en{background:var(--mint);color:var(--mint-ink)}.s-nuev{background:var(--surface-soft);color:var(--ink);border:1px solid var(--line)}
.s-prog{background:var(--sky);color:var(--sky-ink)}.s-aten{background:var(--surface-soft);color:var(--muted);border:1px solid var(--line)}
.cat{background:var(--surface-soft);color:var(--muted);border:1px solid var(--line)}

/* — ACTIONS — */
.actions{display:flex;gap:5px;align-items:center;flex:0 0 auto}
.act-btn{
  background:var(--surface-soft);border:1px solid var(--line);color:var(--ink);
  padding:5px 10px;border-radius:8px;font-size:11px;font-weight:600;cursor:pointer;
}
.act-btn.done-btn{background:rgba(39,174,96,.12);border-color:var(--p-baja);color:var(--p-baja)}
.act-btn.done-btn:active{background:rgba(39,174,96,.25)}
.sel{
  background:var(--surface);border:1px solid var(--line);color:var(--ink);
  padding:4px 6px;border-radius:8px;font-size:11px;cursor:pointer;
}
.sel option{background:var(--surface);color:var(--ink)}

/* — EMPTY — */
.empty{color:var(--muted);font-size:12.5px;padding:28px 16px;text-align:center;border:1px dashed var(--line);border-radius:12px}

/* — FOOTER — */
footer{text-align:center;padding:16px;color:var(--muted);font-size:10.5px;border-top:1px solid var(--line);background:var(--surface-soft)}

/* — TOAST — */
.toast{
  position:fixed;bottom:18px;left:50%;transform:translateX(-50%);
  background:var(--surface);border:1px solid var(--lavender);
  padding:10px 18px;border-radius:12px;font-size:12px;font-weight:600;color:var(--lavender-ink);
  opacity:0;transition:opacity .3s;z-index:50;pointer-events:none;
  box-shadow:0 8px 24px rgba(35,33,47,.12);
}
.toast.show{opacity:1}

/* ==================== MOBILE ==================== */
@media(max-width:600px){
  header{padding:10px 12px 8px}
  header h1{font-size:14px}
  .refresh{padding:6px 10px;font-size:11px}
  .tabs{padding:8px 12px;gap:5px}
  .tab{padding:6px 10px;font-size:11px}
  .cal-prom{margin:10px 12px 0;padding:14px 12px;border-radius:14px}
  .cal-prom .cal-head h2{font-size:14px}
  .cal-grid .day{font-size:11px;padding:5px 0}
  .stats{grid-template-columns:repeat(5,1fr);gap:5px;padding:10px 12px}
  .stat{padding:8px 3px;border-radius:10px}
  .stat .num{font-size:16px}
  .stat .lbl{font-size:8px}
  .panel{padding:10px 12px 32px}
  .list{gap:6px}
  .item{padding:12px;border-radius:12px}
  .item .nom{font-size:12.5px}
  .pill{font-size:9px;padding:2px 6px}
  .actions{width:100%;justify-content:flex-end;margin-top:6px}
  .sel{min-width:65px}
}
@media(max-width:380px){
  .stats{grid-template-columns:repeat(3,1fr)}
}
@media(min-width:900px){
  .cal-prom,.stats,.panel,header,.tabs{max-width:860px;margin-left:auto;margin-right:auto}
}
</style>
</head>
<body>

<header>
  <div>
    <h1>🎵 Ecosistema Coordinación</h1>
    <div class="sub" id="updatedAt">Cargando…</div>
  </div>
  <button class="refresh" onclick="load()">⟳ Actualizar</button>
</header>

<div class="tabs" id="tabs">
  <div class="tab active" data-v="inbox" onclick="setView('inbox')">📥 Inbox</div>
  <div class="tab" data-v="urgente" onclick="setView('urgente')">🔥 Urgente</div>
  <div class="tab" data-v="calendario" onclick="setView('calendario')">📅 Próximos</div>
  <div class="tab" data-v="casos" onclick="setView('casos')">🗂 Casos</div>
  <div class="tab" data-v="todos" onclick="setView('todos')">☰ Todos</div>
</div>

<!-- CALENDARIO PROMINENTE -->
<div class="cal-prom" id="calProm">
  <div class="cal-head">
    <h2>📅 Calendario</h2>
    <div class="cal-legend">
      <span><span class="dot" style="background:var(--sky)"></span> Evento</span>
      <span><span class="dot" style="background:var(--mint)"></span> Caso</span>
      <span><span class="dot" style="background:var(--rose)"></span> Correo</span>
    </div>
  </div>
  <div id="calContent"><div class="cal-empty">Cargando…</div></div>
</div>

<!-- STATS -->
<div class="stats">
  <div class="stat s-total"><div class="num" id="cTotal">–</div><div class="lbl">Ítems</div></div>
  <div class="stat s-alta"><div class="num" id="cAlta">–</div><div class="lbl">Alta</div></div>
  <div class="stat s-media"><div class="num" id="cMedia">–</div><div class="lbl">Media</div></div>
  <div class="stat s-baja"><div class="num" id="cBaja">–</div><div class="lbl">Baja</div></div>
  <div class="stat s-inac"><div class="num" id="cInac">–</div><div class="lbl">Inactivos</div></div>
</div>

<div class="panel"><div class="list" id="lista"><div class="empty">Cargando…</div></div></div>

<footer>Ecosistema Coordinación · base tipo Notion · Google Sheets</footer>
<div class="toast" id="toast"></div>

<script>
var API='https://script.google.com/macros/s/AKfycbzjdrQlGLdTH8mQ2wnj8H3jtgoZWRBnDY0yOMUlHHl8ZUlxThI-rJacQWpPhdtQ1VMI/exec';
var ITEMS=[];var VIEW='inbox';var T_INACT=30;
var CAL_MONTH,CAL_YEAR,CAL_SEL=null;
var CAL_MIN={y:2026,m:7},CAL_MAX={y:2026,m:11}; // ago-dic 2026

function esc(s){return(s||'').replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]});}
function toast(m){var t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(function(){t.classList.remove('show');},2200);}
function diasDesde(f){if(!f)return null;try{var d=new Date(f);if(isNaN(d))return null;return Math.max(0,Math.floor((Date.now()-d)/86400000));}catch(e){return null;}}
function tipoPill(t){t=(t||'').toLowerCase();return t==='correo'?'t-correo':t==='caso'?'t-caso':t==='evento'?'t-evento':t==='tarea'?'t-tarea':'cat';}
function prioPill(n){n=(n||'').toLowerCase();return n==='alta'?'p-alta':n==='media'?'p-media':n==='baja'?'p-baja':'p-otro';}
function estPill(s){s=(s||'').toLowerCase();return s==='en seguimiento'||s==='en curso'?'s-en':s==='nuevo'?'s-nuev':s==='programado'||s==='pendiente'?'s-prog':s==='atendido'?'s-aten':'s-nuev';}
function prioOrd(n){n=(n||'').toLowerCase();return n==='alta'?0:n==='media'?1:n==='baja'?2:3;}
function rcl(n){n=(n||'').toLowerCase();return n==='alta'?'alta':n==='media'?'media':n==='baja'?'baja':'';}
function inac(r){var f=r[5]||r[4];var d=diasDesde(f);return d!==null&&d>T_INACT&&(r[1]||'').toLowerCase()==='caso';}

async function api(p){try{var r=await fetch(API+'?'+new URLSearchParams(p).toString());return await r.json();}catch(e){return{ok:false,error:String(e)};}}

async function load(){
  var d=await api({action:'read',sheet:'Base'});
  if(!d.ok){document.getElementById('lista').innerHTML='<div class="empty">Error: '+(d.error||'?')+'</div>';return;}
  ITEMS=(d.rows||[]).slice(1);
  // Init calendar month
  if(!CAL_MONTH){var now=new Date();CAL_MONTH=now.getMonth();CAL_YEAR=now.getFullYear();}
  render();
  document.getElementById('updatedAt').textContent='Actualizado: '+new Date().toLocaleTimeString('es-CL',{hour:'2-digit',minute:'2-digit'});
}

function setView(v){VIEW=v;document.querySelectorAll('.tab').forEach(function(t){t.classList.toggle('active',t.getAttribute('data-v')===v);});render();}

function filtered(){
  var s=ITEMS.slice();
  if(VIEW==='casos')s=s.filter(function(r){return(r[1]||'').toLowerCase()==='caso';});
  else if(VIEW==='calendario')s=s.filter(function(r){return r[4]||r[5];}).sort(function(a,b){return(a[4]||'').localeCompare(b[4]||'');});
  else if(VIEW==='urgente')s=s.filter(function(r){return(r[3]||'').toLowerCase()==='alta';});
  else if(VIEW==='inbox')s=s.filter(function(r){var e=(r[2]||'').toLowerCase();return e!=='atendido'&&e!=='completado';});
  s.sort(function(a,b){return prioOrd(a[3])-prioOrd(b[3]);});
  return s;
}

// ===== CALENDAR =====
function itemDateStr(r){var d=r[4]||r[5];if(!d)return'';return d.length>10?d.slice(0,10):d;}
function itemsByDate(){
  var map={};
  ITEMS.forEach(function(r){
    var ds=itemDateStr(r);if(!ds)return;
    if(!map[ds])map[ds]=[];
    map[ds].push(r);
  });
  return map;
}
function renderCal(){
  var el=document.getElementById('calContent');
  var byDate=itemsByDate();
  var monthNames=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
  var dowNames=['Lu','Ma','Mi','Ju','Vi','Sa','Do'];
  // Days in month
  var firstDay=new Date(CAL_YEAR,CAL_MONTH,1);
  var daysInMonth=new Date(CAL_YEAR,CAL_MONTH+1,0).getDate();
  var startDow=(firstDay.getDay()+6)%7; // Mon=0
  var today=new Date();today.setHours(0,0,0,0);
  var todayStr=today.getFullYear()+'-'+String(today.getMonth()+1).padStart(2,'0')+'-'+String(today.getDate()).padStart(2,'0');

  var navDisabled='';
  if(CAL_YEAR<=CAL_MIN.y&&CAL_MONTH<=CAL_MIN.m)navDisabled='style="opacity:.3;pointer-events:none"';

  var h='<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">';
  h+='<button class="sel" onclick="calNav(-1)" '+navDisabled+' style="padding:6px 10px">◀</button>';
  h+='<div class="cal-month">'+monthNames[CAL_MONTH]+' '+CAL_YEAR+'</div>';
  var navMax='';
  if(CAL_YEAR>=CAL_MAX.y&&CAL_MONTH>=CAL_MAX.m)navMax='style="opacity:.3;pointer-events:none"';
  h+='<button class="sel" onclick="calNav(1)" '+navMax+' style="padding:6px 10px">▶</button>';
  h+='</div>';

  h+='<div class="cal-grid">';
  dowNames.forEach(function(d){h+='<div class="dow">'+d+'</div>';});
  for(var i=0;i<startDow;i++)h+='<div class="day out"></div>';
  for(var d=1;d<=daysInMonth;d++){
    var ds=CAL_YEAR+'-'+String(CAL_MONTH+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
    var cls='day';
    if(ds===todayStr)cls+=' today';
    if(ds===CAL_SEL)cls+=' today';
    var dayItems=byDate[ds]||[];
    if(dayItems.length){
      // Determine dominant type
      var types={};dayItems.forEach(function(r){var t=(r[1]||'').toLowerCase();types[t]=(types[t]||0)+1;});
      if(types.caso>0)cls+=' has-case';
      else if(types.correo>0)cls+=' has-corr'; // We'll use has-event for this
      // Prefer: caso > evento > correo
      if(types.caso)cls+=' has-case';
      else if(types.evento)cls+=' has-event';
      else cls+=' has-corr'; // default to rose for correo/other
    }
    h+='<div class="'+cls+'" onclick="calSelect(\''+ds+'\')" data-day="'+d+'">'+d;
    if(dayItems.length&&dayItems.length<=3){h+='<div style="display:flex;justify-content:center;gap:2px;margin-top:2px">';
      dayItems.slice(0,3).forEach(function(r){
        var t=(r[1]||'').toLowerCase();
        var dotC=t==='caso'?'var(--mint-ink)':t==='evento'?'var(--sky-ink)':t==='correo'?'var(--rose-ink)':'var(--muted)';
        h+='<span style="width:4px;height:4px;border-radius:50%;background:'+dotC+'"></span>';
      });
      h+='</div>';}
    if(dayItems.length>3)h+='<div style="font-size:8px;color:inherit;opacity:.7">+'+dayItems.length+'</div>';
    h+='</div>';
  }
  h+='</div>';

  // Events for selected day (or today)
  var selDate=CAL_SEL||todayStr;
  var selItems=byDate[selDate]||[];
  h+='<div class="cal-events">';
  if(selItems.length){
    h+='<h3>'+new Date(selDate+'T00:00:00').toLocaleDateString('es-CL',{weekday:'long',day:'numeric',month:'long'})+' — '+selItems.length+' ítem(s)</h3>';
    selItems.forEach(function(r){
      var t=(r[1]||'').toLowerCase();
      var iconCls=t==='evento'?'ev-ev':t==='caso'?'ev-case':'ev-corr';
      var icon=t==='evento'?'📅':t==='caso'?'🗂':'✉';
      h+='<div class="cal-ev-item"><div class="ev-icon '+iconCls+'">'+icon+'</div>';
      h+='<div class="ev-text"><b>'+esc(r[0])+'</b>';
      h+='<span>'+(r[3]?'Prioridad '+esc(r[3]):'')+(r[6]?' · '+esc(r[6]):'')+'</span></div></div>';
    });
  } else {
    h+='<div class="cal-empty">Sin ítems para '+new Date(selDate+'T00:00:00').toLocaleDateString('es-CL',{day:'numeric',month:'long'})+'</div>';
  }
  h+='</div>';
  el.innerHTML=h;
}
function calNav(dir){
  CAL_MONTH+=dir;
  if(CAL_MONTH<0){CAL_MONTH=11;CAL_YEAR--;}
  if(CAL_MONTH>11){CAL_MONTH=0;CAL_YEAR++;}
  renderCal();
}
function calSelect(ds){CAL_SEL=ds;renderCal();}

// ===== RENDER LIST =====
function render(){
  var a=0,m=0,b=0,inx=0;
  ITEMS.forEach(function(r){var p=(r[3]||'').toLowerCase();if(p==='alta')a++;else if(p==='media')m++;else if(p==='baja')b++;if(inac(r))inx++;});
  document.getElementById('cTotal').textContent=ITEMS.length;
  document.getElementById('cAlta').textContent=a;
  document.getElementById('cMedia').textContent=m;
  document.getElementById('cBaja').textContent=b;
  document.getElementById('cInac').textContent=inx;
  renderCal();
  var list=filtered();
  var el=document.getElementById('lista');
  if(!list.length){el.innerHTML='<div class="empty">Sin ítems en esta vista.</div>';return;}
  el.innerHTML=list.map(function(r){
    var idx=ITEMS.indexOf(r);
    var done=(r[2]||'').toLowerCase()==='atendido'||(r[2]||'').toLowerCase()==='completado';
    var fecha=r[4];if(fecha&&fecha.length>10)fecha=fecha.slice(0,10);
    var vence=r[5];if(vence&&vence.length>10)vence=vence.slice(0,10);
    var ia=inac(r);
    return '<div class="item '+rcl(r[3])+(ia?' inac':'')+(done?' done':'')+'">'+
      '<div class="main"><div class="nom">'+esc(r[0])+
      (r[8]?'<span class="extra">'+esc(r[8])+'</span>':'')+'</div>'+
      '<div class="meta"><span class="pill '+tipoPill(r[1])+'">'+esc(r[1])+'</span>'+
      '<span class="pill '+prioPill(r[3])+'">'+esc(r[3])+'</span>'+
      '<span class="pill '+estPill(r[2])+'">'+esc(r[2])+'</span>'+
      (fecha?'<span>📅 '+esc(fecha)+'</span>':'')+
      (vence?'<span>⏰ '+esc(vence)+'</span>':'')+
      (r[6]?'<span class="pill cat">'+esc(r[6])+'</span>':'')+
      (ia?'<span class="pill p-inac">⚠ inactivo '+diasDesde(r[5]||r[4])+'d</span>':'')+
      '</div></div>'+
      '<div class="actions">'+
        (done?'<span class="pill s-aten">✓</span>':
          '<select class="sel" onchange="setPrio('+idx+',this.value)">'+
          '<option value="Alta"'+((r[3]||'').toLowerCase()==='alta'?' selected':'')+'>Alta</option>'+
          '<option value="Media"'+((r[3]||'').toLowerCase()==='media'?' selected':'')+'>Media</option>'+
          '<option value="Baja"'+((r[3]||'').toLowerCase()==='baja'?' selected':'')+'>Baja</option></select>'+
          '<button class="act-btn done-btn" onclick="markDone('+idx+')">✓ estado</button>')+
      '</div></div>';
  }).join('');
}

async function setPrio(idx,val){
  var row=idx+2;
  await api({action:'update',sheet:'Base',row:row,col:'D',value:val});
  toast('Prioridad → '+val+' ✓');load();
}
async function markDone(idx){
  var row=idx+2,cur=(ITEMS[idx][2]||'').toLowerCase();
  var nuevo=cur==='atendido'||cur==='completado'?'Nuevo':'Atendido';
  await api({action:'update',sheet:'Base',row:row,col:'C',value:nuevo});
  toast((nuevo==='Atendido'?'✓ Completado':'Reabierto'));load();
}

load();
setInterval(load,120000);
</script>
</body>
</html>
